<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>승상 할일판</title>
<meta name="theme-color" content="#2e55c9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 위에 분류 버튼 + 쓰는 칸, 그 아래 '급한 일' 모아보기, 이어서 분류별로 접고 펴는 토글 묶음 */
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1b2230;
  --muted: #667085;
  --line: #e1e5ec;
  --accent: #2e55c9;
  --accent-soft: #e5ebfb;
  --late: #c4321f;
  --late-soft: #fbe7e3;
  --soon: #b25e00;
  --soon-soft: #fbeedb;
  --ok: #1f7a4d;
  --ok-soft: #e1f3e9;
  --star: #c98a00;
  --toast: #1b2230;
  --toast-fg: #f3f5f8;
  /* 분류 색: 진한색 / 옅은 바탕 / 글자 */
  --green: #1f8a5b; --green-s: #e3f4ea; --green-t: #17694a;
  --orange: #e07020; --orange-s: #fdeedd; --orange-t: #9a4a0b;
  --purple: #6b4fd8; --purple-s: #ece8fc; --purple-t: #5038b0;
  --blue: #2563c9; --blue-s: #e3ecfb; --blue-t: #1f4fa3;
  --pink: #d6407e; --pink-s: #fce6ef; --pink-t: #a32a5c;
  --teal: #0f8b8d; --teal-s: #dcf3f3; --teal-t: #0b6466;
  --amber: #c98a00; --amber-s: #fbf1d6; --amber-t: #7a5300;
  --slate: #5b6578; --slate-s: #eceef2; --slate-t: #3f4757;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #1a2029; --fg: #e6e9ef; --muted: #98a2b3; --line: #2b3340;
    --accent: #7f9cf5; --accent-soft: #232d45; --late: #f08a78; --late-soft: #3a211d;
    --soon: #f0b25c; --soon-soft: #372b18; --ok: #6fcf9b; --ok-soft: #17301f; --star: #f2c14e;
    --toast: #e6e9ef; --toast-fg: #11151c; color-scheme: dark;
    --green: #4cc38a; --green-s: #16301f; --green-t: #8fe0b6;
    --orange: #f0924d; --orange-s: #3a2616; --orange-t: #f7bb8c;
    --purple: #9d86f5; --purple-s: #2a2445; --purple-t: #c6b8fb;
    --blue: #6c9cf0; --blue-s: #1d2a45; --blue-t: #a9c4f7;
    --pink: #ee78a8; --pink-s: #3d1f2c; --pink-t: #f6aecb;
    --teal: #43c3c4; --teal-s: #133233; --teal-t: #8fe0e0;
    --amber: #f0c14e; --amber-s: #382d13; --amber-t: #f6d98c;
    --slate: #9aa3b4; --slate-s: #262c36; --slate-t: #c7cdd8;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #1a2029; --fg: #e6e9ef; --muted: #98a2b3; --line: #2b3340;
  --accent: #7f9cf5; --accent-soft: #232d45; --late: #f08a78; --late-soft: #3a211d;
  --soon: #f0b25c; --soon-soft: #372b18; --ok: #6fcf9b; --ok-soft: #17301f; --star: #f2c14e;
  --toast: #e6e9ef; --toast-fg: #11151c; color-scheme: dark;
  --green: #4cc38a; --green-s: #16301f; --green-t: #8fe0b6;
  --orange: #f0924d; --orange-s: #3a2616; --orange-t: #f7bb8c;
  --purple: #9d86f5; --purple-s: #2a2445; --purple-t: #c6b8fb;
  --blue: #6c9cf0; --blue-s: #1d2a45; --blue-t: #a9c4f7;
  --pink: #ee78a8; --pink-s: #3d1f2c; --pink-t: #f6aecb;
  --teal: #43c3c4; --teal-s: #133233; --teal-t: #8fe0e0;
  --amber: #f0c14e; --amber-s: #382d13; --amber-t: #f6d98c;
  --slate: #9aa3b4; --slate-s: #262c36; --slate-t: #c7cdd8;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 2px; }
.top h1 { font-size: 22px; margin: 0; }
.top .date { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.status { color: var(--muted); font-size: 13px; }
.status.err { color: var(--late); }

button {
  font: inherit; cursor: pointer; border-radius: 7px; padding: 7px 13px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 5px 8px; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 입력 */
.compose { background: var(--surface); border: 0; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 1px 3px rgba(28,33,48,.08); }
.inrow { display: flex; gap: 8px; align-items: stretch; }
.inrow textarea { flex: 1; min-width: 0; }
.inrow button { border-radius: 10px; padding: 0 16px; background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); }
.cats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { padding: 5px 12px; border-radius: 999px; font-size: 13.5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 700; }
.cats .chip { border-radius: 10px; padding: 5px 13px; border-width: 2px; }
.chip.cat { background: var(--cs); color: var(--ct); border-color: transparent; }
.chip.cat[aria-pressed="true"] { background: var(--cs); color: var(--ct); border-color: var(--c); font-weight: 700; }
.dues { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dues .lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.dues .chip { padding: 3px 10px; font-size: 12.5px; }
.dues input[type="date"] { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.dues input[type="date"].on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip.add { border-style: dashed; color: var(--muted); background: transparent; }
.chip.sm { padding: 3px 10px; font-size: 12.5px; }
.newcat { display: flex; gap: 6px; }
.newcat input { font: inherit; font-size: 13.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--accent); border-radius: 999px; padding: 4px 12px; width: 9em; }
.newcat button { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
.compose textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 2px solid transparent; border-radius: 10px; resize: none;
  width: 100%; min-height: 44px; padding: 9px 12px; outline: none; line-height: 1.4;
}
.compose textarea:focus { border-color: var(--c, var(--accent)); }
.compose .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.preview { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.preview .p { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.preview .p span:last-child { overflow-wrap: anywhere; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); }
.hint code { font-family: var(--font-mono); background: var(--bg); padding: 0 4px; border-radius: 4px; }
.hint b { color: var(--accent); font-weight: 700; }
.hint .tip { display: block; }

/* 검색·보기 */
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 200px; min-width: 0; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.toggle { font-size: 13px; padding: 6px 10px; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tools .io { font-size: 13px; padding: 6px 10px; color: var(--muted); }

/* 묶음 */
.groups { display: flex; flex-direction: column; gap: 10px; }
details.group { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
details.group.focus { border-color: var(--late); }
details.group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 12px; user-select: none; }
details.group > summary::-webkit-details-marker { display: none; }
.caret { width: 0; height: 0; border-left: 6px solid var(--muted); border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; flex: none; }
details.group[open] .caret { transform: rotate(90deg); }
.gname { font-weight: 700; color: var(--ct, var(--fg)); }
.focus .gname { color: var(--late); }
details.group.focus > summary { background: var(--late-soft); }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--c); border: 0; padding: 0; flex: none; }
button.dot { cursor: pointer; }
.gcount { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.gnext { margin-left: auto; }
.gdel { padding: 2px 8px; font-size: 12px; border: 0; background: transparent; color: var(--muted); }
.gdel.armed { background: var(--late); color: var(--surface); border-radius: 6px; }
.gbody { border-top: 1px solid var(--line); }
.gempty { color: var(--muted); font-size: 13px; padding: 10px 14px; }
.handle { color: var(--muted); cursor: grab; padding: 2px 6px; margin-left: -6px; font-size: 16px; line-height: 1; touch-action: none; }
.sort-ghost { opacity: .35; }
.sort-chosen { outline: 2px solid var(--accent); outline-offset: 1px; }
.prog { width: 42px; height: 4px; border-radius: 2px; background: var(--cs, var(--line)); overflow: hidden; flex: none; }
.prog i { display: block; height: 100%; background: var(--c, var(--ok)); }

/* 할 일 한 줄 */
.swipe { position: relative; border-top: 1px solid var(--line); overflow: hidden; }
.swipe:first-child { border-top: 0; }
.swipe .under { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 13px; font-weight: 700; }
.swipe .under.right { background: var(--ok-soft); color: var(--ok); }
.swipe .under.left { background: var(--late-soft); color: var(--late); }
.row { position: relative; background: var(--surface); display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 8px 6px 8px 12px; touch-action: pan-y; }
.row.late { background: var(--late-soft); }
.check { width: 22px; height: 22px; margin-top: 3px; border-radius: 6px; padding: 0; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; flex: none; }
.done > .check, .sub.done .check { background: var(--ok); border-color: var(--ok); }
.done > .check::after, .sub.done .check::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
textarea.text {
  font: inherit; color: var(--fg); background: transparent; border: 0; resize: none; overflow: hidden;
  width: 100%; min-width: 0; padding: 2px 4px; border-radius: 5px; line-height: 1.5;
}
textarea.text:focus { outline: none; background: var(--bg); }
.row.done textarea.text { color: var(--muted); text-decoration: line-through; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); padding: 0 4px; }
.meta a { color: var(--accent); }
.meta .cat { background: var(--cs, var(--bg)); color: var(--ct, var(--muted)); border-radius: 5px; padding: 0 7px; }
.subs { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 0 4px; }
.sub { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: start; }
.sub .check { width: 17px; height: 17px; margin-top: 4px; border-width: 2px; border-radius: 4px; }
.sub.done .check::after { width: 4px; height: 8px; }
.sub textarea.text { font-size: 14px; padding: 1px 4px; }
.sub.done textarea.text { color: var(--muted); text-decoration: line-through; }
.subadd { font: inherit; font-size: 13.5px; color: var(--fg); background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 4px 8px; width: 100%; min-width: 0; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }
.acts { display: flex; gap: 0; }
.dday {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 0;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; cursor: pointer;
}
.dday.late { background: var(--late-soft); color: var(--late); }
.row.late .dday.late { background: var(--surface); }
.dday.soon { background: var(--soon-soft); color: var(--soon); }
.dday.none { background: transparent; color: var(--muted); font-weight: 500; }
.side input[type="date"] { font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
.ic { width: 30px; height: 30px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 17px; line-height: 1; border-radius: 6px; }
.ic:hover { background: var(--bg); }
.ic.x:hover { color: var(--late); background: var(--late-soft); }
.ic.star.on { color: var(--star); }
.ic.small { width: 24px; height: 24px; font-size: 15px; }
.panel { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; padding: 6px 4px 4px 30px; }
.panel .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.donebar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 12px; background: var(--bg); border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; border: 1px dashed var(--line); border-radius: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--toast); color: var(--toast-fg); border-radius: 10px; padding: 8px 8px 8px 14px;
  display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); z-index: 5;
}
.toast button { background: transparent; color: var(--toast-fg); border-color: var(--toast-fg); padding: 4px 10px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>할일판</h1>
    <span class="date" id="today"></span>
  </header>

  <div class="compose" id="composeBox">
    <div class="cats" id="cats" role="group" aria-label="분류 고르기"></div>
    <div class="inrow">
      <textarea id="compose" rows="1" placeholder="할 일 적기 · 여러 줄이면 줄마다 하나씩" aria-label="새 할 일"></textarea>
      <button class="primary" id="addBtn" type="button">추가</button>
    </div>
    <div class="dues" id="dues" role="group" aria-label="마감일 고르기"></div>
    <div class="preview" id="preview" hidden></div>
    <span class="hint" id="hint"></span>
  </div>

  <div class="tools">
    <input class="search" id="search" type="search" placeholder="검색" aria-label="할 일 검색">
    <button class="toggle" id="hideDone" type="button" aria-pressed="false">완료 숨기기</button>
    <button class="io" id="exportBtn" type="button" title="이 기기의 할 일을 JSON 파일로 저장">내보내기</button>
    <button class="io" id="importBtn" type="button" title="다른 기기에서 내보낸 JSON 파일을 합치기">가져오기</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>

  <div class="status" id="status">불러오는 중…</div>
  <div class="groups" id="groups"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undoBtn" type="button">되돌리기</button></div>

<script>
const NONE = "미분류";
const FOCUS = "__focus";
const SOON_DAYS = 3;
const $ = (id) => document.getElementById(id);
const PALETTE = ["green", "orange", "purple", "blue", "pink", "teal", "amber", "slate"];
const PALETTE_KO = { green: "초록", orange: "주황", purple: "보라", blue: "파랑", pink: "분홍", teal: "청록", amber: "노랑", slate: "회색" };
let tasks = [];
let cats = [];
let catColors = {};
let composeDue = "";
let db = null, col = null, catsDoc = null;
let addingCat = false;
let armedCat = null;
let dateOpen = null;
let panelOpen = null;
let query = "";
let undoStack = null, toastTimer = null;
let dragging = false;
const saveTimers = {};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let closed = new Set(store.get("closedGroups", []));
let selected = store.get("selectedCat", null);
let hideDone = store.get("hideDone", false);

/* ---------- 저장소: 이 브라우저의 localStorage ----------
   할 일은 {tasks: {id: 문서}, meta: {categories: 문서}} 한 덩어리로 저장한다.
   다른 탭에서 바꾸면 storage 이벤트로 따라온다. */
const DATA_KEY = "todo-board:data";
function makeDb() {
  let state = store.get(DATA_KEY, null) || {};
  const listeners = {};
  const bucket = (name) => (state[name] = state[name] || {});
  const subs = (name) => (listeners[name] = listeners[name] || new Set());
  function persist() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(state)); }
    catch { const err = new Error("quota"); err.code = "quota_exceeded"; throw err; }
  }
  function emit(name) { for (const fn of subs(name)) fn(); }
  function commit(name) { persist(); emit(name); }
  window.addEventListener("storage", (e) => {
    if (e.key !== DATA_KEY || !e.newValue) return;
    try { state = JSON.parse(e.newValue); } catch { return; }
    for (const name in listeners) emit(name);
  });
  function docRef(name, id) {
    return {
      async set(data) { bucket(name)[id] = { ...data }; commit(name); },
      async update(data) { bucket(name)[id] = { ...(bucket(name)[id] || {}), ...data }; commit(name); },
      async delete() { delete bucket(name)[id]; commit(name); },
      onSnapshot(cb) {
        const fn = () => { const d = bucket(name)[id]; cb({ exists: !!d, data: () => ({ ...d }) }); };
        subs(name).add(fn); fn();
      },
    };
  }
  return {
    collection(name) {
      return {
        async add(data) { const id = newId(); bucket(name)[id] = { ...data }; commit(name); return { id }; },
        doc(id) { return docRef(name, id); },
        onSnapshot(cb) {
          const fn = () => cb({ docs: Object.entries(bucket(name)).map(([id, data]) => ({ id, data: () => ({ ...data }) })) });
          subs(name).add(fn); fn();
        },
      };
    },
    doc(path) { const [name, id] = path.split("/"); return docRef(name, id); },
    dump() { return state; },
    merge(obj) {
      for (const name in obj) if (obj[name] && typeof obj[name] === "object") Object.assign(bucket(name), obj[name]);
      persist();
      for (const name in listeners) emit(name);
    },
  };
}

/* ---------- 날짜 ---------- */
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today0() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function daysLeft(due) {
  if (!due) return null;
  const [y, m, d] = due.split("-").map(Number);
  return Math.round((new Date(y, m - 1, d) - today0()) / 86400000);
}
function ddayLabel(n) { return n === 0 ? "D-DAY" : n > 0 ? "D-" + n : "D+" + (-n); }
function ddayClass(n) { return n === null ? "none" : n < 0 ? "late" : n <= SOON_DAYS ? "soon" : ""; }
function fmtDate(due) {
  const [, m, d] = due.split("-").map(Number);
  return m + "/" + d + "(" + "일월화수목금토"[new Date(due + "T00:00:00").getDay()] + ")";
}
const WD = { "일": 0, "월": 1, "화": 2, "수": 3, "목": 4, "금": 5, "토": 6 };
// 본문에서 마감일을 찾아 빼낸다. 지원: 2026-11-12, 11/12, ~11/12, 11월 12일, 오늘·내일·모레·글피,
// 3일 뒤(후), D-3, (이번주·다음주) 금 / 금요일. 두 달 넘게 지난 월/일은 내년으로 본다.
function parseLine(line) {
  const t0 = today0();
  const rules = [
    [/(?:^|\s)~?(\d{4})-(\d{1,2})-(\d{1,2})(?=\s|$)/, m => new Date(+m[1], +m[2] - 1, +m[3])],
    [/(?:^|\s)~?(\d{1,2})\/(\d{1,2})(?=\s|$)/, m => monthDay(+m[1], +m[2])],
    [/(?:^|\s)~?(\d{1,2})월\s?(\d{1,2})일(?:까지)?(?=\s|$)/, m => monthDay(+m[1], +m[2])],
    [/(?:^|\s)(오늘|내일|모레|글피)(?:까지)?(?=\s|$)/, m => addDays(t0, { "오늘": 0, "내일": 1, "모레": 2, "글피": 3 }[m[1]])],
    [/(?:^|\s)(\d{1,3})일\s?(?:뒤|후)(?:까지)?(?=\s|$)/, m => addDays(t0, +m[1])],
    [/(?:^|\s)[dD]-(\d{1,3})(?=\s|$)/, m => addDays(t0, +m[1])],
    // 요일 한 글자는 흔한 글자라 '이번주/다음주'가 앞에 붙거나 '요일'까지 쓴 경우만 날짜로 본다
    [/(?:^|\s)(이번\s?주|다음\s?주|담주)\s?([일월화수목금토])(?:요일)?(?:까지)?(?=\s|$)/, m => weekday(m[1], m[2])],
    [/(?:^|\s)([일월화수목금토])요일(?:까지)?(?=\s|$)/, m => weekday("", m[1])],
  ];
  for (const [re, fn] of rules) {
    const m = line.match(re);
    if (!m) continue;
    const d = fn(m);
    if (!d || isNaN(d)) continue;
    return { text: line.replace(m[0], " ").replace(/\s+/g, " ").trim(), due: ymd(d) };
  }
  return { text: line.replace(/\s+/g, " ").trim(), due: "" };
  function monthDay(mo, da) {
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
    let d = new Date(t0.getFullYear(), mo - 1, da);
    if ((t0 - d) / 86400000 > 60) d = new Date(t0.getFullYear() + 1, mo - 1, da);
    return d;
  }
  function weekday(which, ch) {
    const target = WD[ch];
    const mondayDiff = (t0.getDay() + 6) % 7;
    const thisMon = addDays(t0, -mondayDiff);
    if (which) {
      const base = /다음|담/.test(which) ? addDays(thisMon, 7) : thisMon;
      return addDays(base, (target + 6) % 7);
    }
    return addDays(t0, (target - t0.getDay() + 7) % 7);
  }
}

function urlOf(text) { const m = (text || "").match(/https?:\/\/\S+/); return m ? m[0] : ""; }
function catOf(t) { return t.cat && cats.includes(t.cat) ? t.cat : NONE; }
function colorOf(name) {
  if (name === NONE) return "slate";
  return PALETTE.includes(catColors[name]) ? catColors[name] : PALETTE[Math.max(0, cats.indexOf(name)) % PALETTE.length];
}
function cstyle(name) { const k = colorOf(name); return "--c:var(--" + k + ");--cs:var(--" + k + "-s);--ct:var(--" + k + "-t)"; }
function isUrgent(t) { if (t.done) return false; if (t.star) return true; const n = daysLeft(t.due); return n !== null && n <= SOON_DAYS; }
function matches(t) {
  if (!query) return true;
  const q = query.toLowerCase();
  return (t.text || "").toLowerCase().includes(q) || (t.sub || []).some(s => (s.text || "").toLowerCase().includes(q));
}

/* ---------- 공통 ---------- */
function setStatus(msg, err) {
  const s = $("status");
  s.textContent = msg || "";
  s.hidden = !msg;
  s.classList.toggle("err", !!err);
}
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}
function grow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
function newId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3); }

async function write(fn) {
  try { await fn(); return true; }
  catch (e) {
    setStatus(e && e.code === "quota_exceeded" ? "브라우저 저장 공간이 찼습니다. 완료한 항목을 지워 주세요."
      : "저장하지 못했습니다. 잠시 뒤 다시 해 주세요.", true);
    return false;
  }
}
function patch(t, data) { Object.assign(t, data); return write(() => col.doc(t.id).update(data)); }

/* ---------- 분류 ---------- */
function saveCats(list, colors) {
  cats = list;
  if (colors) catColors = colors;
  const kept = {};
  for (const c of list) kept[c] = colorOf(c);
  catColors = kept;
  render();
  return write(() => catsDoc.set({ list, colors: kept }));
}
function cycleColor(name) {
  const next = PALETTE[(PALETTE.indexOf(colorOf(name)) + 1) % PALETTE.length];
  saveCats(cats, { ...catColors, [name]: next });
}
async function addCat(name) {
  name = name.trim().replace(/\s+/g, " ");
  addingCat = false;
  if (!name || name === NONE) { render(); return; }
  if (!cats.includes(name)) {
    const used = new Set(cats.map(colorOf));
    const free = PALETTE.find(k => !used.has(k) && k !== "slate") || PALETTE[cats.length % PALETTE.length];
    await saveCats([...cats, name], { ...catColors, [name]: free });
  }
  selected = name; store.set("selectedCat", selected);
  render();
  $("compose").focus();
}
async function deleteCat(name) {
  if (armedCat !== name) { armedCat = name; render(); return; }
  armedCat = null;
  if (selected === name) { selected = null; store.set("selectedCat", null); }
  await saveCats(cats.filter(c => c !== name));
  for (const t of tasks.filter(t => t.cat === name)) await patch(t, { cat: "" });
}

function renderCats() {
  const box = $("cats");
  box.replaceChildren();
  if (selected && !cats.includes(selected)) selected = null;
  for (const c of cats) {
    box.append(el("button", { class: "chip cat", type: "button", style: cstyle(c), "data-cat": c, "aria-pressed": String(selected === c),
      onclick: () => { selected = selected === c ? null : c; store.set("selectedCat", selected); render(); $("compose").focus(); } }, c));
  }
  if (addingCat) {
    const inp = el("input", { id: "newCatInput", placeholder: "새 분류 이름", "aria-label": "새 분류 이름", maxlength: "20" });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addCat(inp.value); }
      if (e.key === "Escape") { addingCat = false; render(); }
    });
    box.append(el("span", { class: "newcat" }, inp,
      el("button", { type: "button", class: "primary", onclick: () => addCat(inp.value) }, "만들기"),
      el("button", { type: "button", onclick: () => { addingCat = false; render(); } }, "취소")));
    requestAnimationFrame(() => inp.focus());
  } else {
    box.append(el("button", { class: "chip add", type: "button", onclick: () => { addingCat = true; render(); } }, "+ 분류 추가"));
  }
  $("composeBox").setAttribute("style", selected ? cstyle(selected) : "");
  const hint = $("hint");
  hint.replaceChildren();
  hint.append(selected ? el("b", { style: "color:var(--ct)" }, selected) : NONE, "에 추가 · 글에 ", el("code", null, "11/12"), " ", el("code", null, "내일"), "을 써도 날짜가 됩니다 · Shift+Enter 줄바꿈");
  renderDues();
}

/* ---------- 입력 칸의 마감일 고르기 ---------- */
function renderDues() {
  const box = $("dues");
  box.replaceChildren();
  const t0 = today0();
  const fri = addDays(t0, (5 - t0.getDay() + 7) % 7);
  const nextMon = addDays(t0, ((1 - t0.getDay() + 7) % 7) || 7);
  const opts = [["없음", ""], ["오늘", ymd(t0)], ["내일", ymd(addDays(t0, 1))], ["금 " + fmtDate(ymd(fri)).split("(")[0], ymd(fri)], ["다음 월", ymd(nextMon)]];
  box.append(el("span", { class: "lbl" }, "마감"));
  let matched = false;
  for (const [label, v] of opts) {
    if (opts.findIndex(o => o[1] === v) !== opts.findIndex(o => o[0] === label)) continue; // 같은 날짜가 겹치면 하나만
    const on = composeDue === v;
    if (on) matched = true;
    box.append(el("button", { class: "chip", type: "button", "aria-pressed": String(on), onclick: () => { composeDue = v; renderDues(); renderPreview(); } }, label));
  }
  const pick = el("input", { type: "date", id: "composeDate", class: !matched && composeDue ? "on" : "", value: !matched ? composeDue : "", "aria-label": "마감일 직접 고르기" });
  pick.addEventListener("change", () => { composeDue = pick.value; renderDues(); renderPreview(); });
  box.append(pick);
}

/* ---------- 입력 ---------- */
function renderPreview() {
  const box = $("preview");
  const lines = $("compose").value.split("\n").map(s => s.trim()).filter(Boolean);
  box.replaceChildren();
  const parsed = lines.map(parseLine).filter(p => p.text).map(p => ({ ...p, due: p.due || composeDue }));
  if (!parsed.length) { box.hidden = true; return; }
  box.hidden = false;
  for (const p of parsed.slice(0, 6)) {
    const n = daysLeft(p.due);
    box.append(el("div", { class: "p" },
      p.due ? el("span", { class: "dday " + ddayClass(n) }, ddayLabel(n) + " " + fmtDate(p.due)) : el("span", { class: "dday none" }, "날짜 없음"),
      el("span", null, p.text)));
  }
  if (parsed.length > 6) box.append(el("div", { class: "hint" }, "외 " + (parsed.length - 6) + "개"));
}
async function addFromCompose() {
  const ta = $("compose");
  const lines = ta.value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  $("addBtn").disabled = true;
  const base = Date.now();
  const cat = selected || "";
  let ok = true;
  for (let i = 0; i < lines.length && ok; i++) {
    const p = parseLine(lines[i]);
    const text = p.text, due = p.due || composeDue;
    if (!text) continue;
    ok = await write(() => col.add({ text, due, cat, star: false, sub: [], done: false, doneAt: null, createdAt: base + i }));
  }
  $("addBtn").disabled = false;
  if (ok) {
    ta.value = ""; composeDue = ""; grow(ta); renderDues(); renderPreview(); ta.focus(); setStatus("");
    const g = cat || NONE;
    if (closed.has(g)) { closed.delete(g); store.set("closedGroups", [...closed]); render(); }
  }
}

/* ---------- 할 일 조작 ---------- */
function toggle(t) { const done = !t.done; patch(t, { done, doneAt: done ? Date.now() : null }); render(); }
function saveText(t, value) {
  clearTimeout(saveTimers[t.id]);
  const text = value.trim();
  if (text === t.text) return;
  if (!text) { removeMany([t]); return; }
  patch(t, { text });
}
function saveDue(t, due) { dateOpen = null; patch(t, { due }); render(); }
function saveSubs(t, sub) { patch(t, { sub }); }
async function removeMany(list) {
  if (!list.length) return;
  const snapshot = list.map(t => { const { id, ...data } = t; return { id, data }; });
  const ids = new Set(list.map(t => t.id));
  tasks = tasks.filter(t => !ids.has(t.id));
  render();
  for (const t of list) await write(() => col.doc(t.id).delete());
  undoStack = snapshot;
  showToast(list.length === 1 ? "지웠습니다" : list.length + "개를 지웠습니다");
}
function showToast(msg) {
  $("toastMsg").textContent = msg;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; undoStack = null; }, 6000);
}
$("undoBtn").addEventListener("click", async () => {
  const items = undoStack;
  undoStack = null;
  $("toast").hidden = true;
  if (!items) return;
  for (const it of items) await write(() => col.doc(it.id).set(it.data));
});

/* ---------- 내보내기 · 가져오기 ---------- */
$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(db.dump(), null, 2)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "todo-board-" + ymd(new Date()) + ".json" });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { setStatus("JSON 파일이 아닙니다.", true); return; }
  if (!obj || typeof obj !== "object" || !obj.tasks) { setStatus("할일판에서 내보낸 파일이 아닙니다.", true); return; }
  const before = tasks.length;
  const ok = await write(() => db.merge(obj));
  if (ok) { setStatus(""); showToast("할 일 " + (tasks.length - before) + "개를 새로 가져왔습니다"); undoStack = null; }
});

/* ---------- 밀어서 완료·삭제 (터치만) ---------- */
function attachSwipe(wrapEl, rowEl, t) {
  let x0 = 0, y0 = 0, dx = 0, active = false, decided = false, pid = null;
  const right = wrapEl.querySelector(".under.right"), left = wrapEl.querySelector(".under.left");
  rowEl.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || e.target.closest("button, a, input")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; active = true; decided = false; pid = e.pointerId;
  });
  rowEl.addEventListener("pointermove", (e) => {
    if (!active || e.pointerId !== pid) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!decided) {
      if (Math.abs(ddy) > 10) { active = false; return; }
      if (Math.abs(ddx) < 12) return;
      decided = true;
      rowEl.setPointerCapture(pid);
      if (document.activeElement && rowEl.contains(document.activeElement)) document.activeElement.blur();
    }
    dx = ddx;
    rowEl.style.transform = "translateX(" + dx + "px)";
    right.hidden = dx <= 0; left.hidden = dx >= 0;
  });
  const end = () => {
    if (!active) return;
    active = false;
    const w = rowEl.offsetWidth;
    rowEl.style.transition = "transform .18s";
    if (decided && dx > w * 0.35) { rowEl.style.transform = "translateX(0)"; toggle(t); }
    else if (decided && dx < -w * 0.35) { rowEl.style.transform = "translateX(-100%)"; setTimeout(() => removeMany([t]), 150); }
    else rowEl.style.transform = "translateX(0)";
    setTimeout(() => { rowEl.style.transition = ""; }, 200);
  };
  rowEl.addEventListener("pointerup", end);
  rowEl.addEventListener("pointercancel", end);
}

/* ---------- 그리기 ---------- */
function textBox(value, onSave, cls) {
  const ta = el("textarea", { class: "text" + (cls ? " " + cls : ""), rows: "1", "aria-label": "내용" });
  ta.value = value || "";
  let timer = null;
  ta.addEventListener("input", () => { grow(ta); clearTimeout(timer); timer = setTimeout(() => onSave(ta.value), 1200); });
  ta.addEventListener("blur", () => { clearTimeout(timer); onSave(ta.value); });
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ta.blur(); } });
  requestAnimationFrame(() => grow(ta));
  return ta;
}

function subsView(t) {
  const subs = t.sub || [];
  const box = el("div", { class: "subs" });
  subs.forEach((s, i) => {
    box.append(el("div", { class: "sub" + (s.done ? " done" : "") },
      el("button", { class: "check", type: "button", "aria-label": s.done ? "하위 항목 완료 취소" : "하위 항목 완료",
        onclick: () => { const next = subs.map((x, j) => j === i ? { ...x, done: !x.done } : x); saveSubs(t, next); render(); } }),
      textBox(s.text, (v) => {
        const text = v.trim();
        if (text === s.text) return;
        const next = text ? subs.map((x, j) => j === i ? { ...x, text } : x) : subs.filter((_, j) => j !== i);
        saveSubs(t, next);
      }),
      el("button", { class: "ic small x", type: "button", "aria-label": "하위 항목 지우기",
        onclick: () => { saveSubs(t, subs.filter((_, j) => j !== i)); render(); } }, "×")));
  });
  if (panelOpen === t.id) {
    const inp = el("input", { class: "subadd", placeholder: "+ 하위 항목 (예: 성적증명서) · Enter", "aria-label": "하위 항목 추가" });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        const text = inp.value.trim();
        if (!text) return;
        saveSubs(t, [...(t.sub || []), { id: newId(), text, done: false }]);
        inp.value = "";
        render();
        requestAnimationFrame(() => { const n = document.querySelector('[data-subadd="' + t.id + '"]'); if (n) n.focus(); });
      }
    });
    inp.dataset.subadd = t.id;
    box.append(inp);
  }
  return subs.length || panelOpen === t.id ? box : null;
}

function panelView(t) {
  const line = el("div", { class: "line" }, "분류 옮기기");
  for (const c of [...cats, NONE]) {
    const cur = catOf(t) === c;

  }
  const line2 = el("div", { class: "line" },
    t.due ? el("button", { class: "chip sm", type: "button", onclick: () => saveDue(t, "") }, "마감일 지우기") : null,
    el("button", { class: "chip sm", type: "button", onclick: () => { panelOpen = null; render(); } }, "닫기"));
  return el("div", { class: "panel" }, line, line2);
}

function rowView(t, showCat) {
  const n = daysLeft(t.due);
  const late = !t.done && n !== null && n < 0;

  } else {

      onclick: () => { dateOpen = t.id; render(); } },
      t.done ? (t.due ? fmtDate(t.due) : "") : n === null ? "+날짜" : ddayLabel(n) + " " + fmtDate(t.due));
  }
  const subs = t.sub || [];
  const subDone = subs.filter(s => s.done).length;
  const url = urlOf(t.text);
  const meta = (showCat || subs.length || url) ? el("div", { class: "meta" },
    showCat ? el("span", { class: "cat", style: cstyle(catOf(t)) }, catOf(t)) : null,
    subs.length ? el("span", null, "하위 " + subDone + "/" + subs.length) : null,
    url ? el("a", { href: url, target: "_blank", rel: "noopener" }, "링크 열기") : null) : null;

  const row = el("div", { class: "row" + (t.done ? " done" : "") + (late ? " late" : "") },
    el("button", { class: "check", type: "button", "aria-label": t.done ? "완료 취소" : "완료", onclick: () => toggle(t) }),
    el("div", { class: "body" }, textBox(t.text, (v) => saveText(t, v)), meta, subsView(t)),
    el("div", { class: "side" }, dateCtl,
      el("div", { class: "acts" },
        el("button", { class: "ic star" + (t.star ? " on" : ""), type: "button", "aria-label": t.star ? "중요 해제" : "중요 표시", "aria-pressed": String(!!t.star),
          onclick: () => { patch(t, { star: !t.star }); render(); } }, t.star ? "★" : "☆"),
        el("button", { class: "ic", type: "button", "aria-label": "더 보기 (하위 항목, 분류 옮기기)", "aria-expanded": String(panelOpen === t.id),
          onclick: () => { panelOpen = panelOpen === t.id ? null : t.id; render(); } }, "⋯"),
        el("button", { class: "ic x", type: "button", "aria-label": "지우기", onclick: () => removeMany([t]) }, "×")))
  );
  if (panelOpen === t.id) row.append(panelView(t));
  const wrapEl = el("div", { class: "swipe" },
    el("div", { class: "under right", hidden: "" }, t.done ? "완료 취소" : "완료"),
    el("div", { class: "under left", hidden: "" }, el("span"), "지우기"),
    row);
  attachSwipe(wrapEl, row, t);
  return wrapEl;
}

function byDue(a, b) {
  if (!!a.star !== !!b.star) return a.star ? -1 : 1;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}

function groupView(name, label, items, opts) {
  const open = items.filter(t => !t.done).sort(byDue);
  const done = opts.focus || hideDone ? [] : items.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const total = items.length, doneCount = items.filter(t => t.done).length;
  const next = open.find(t => t.due);
  const n = next ? daysLeft(next.due) : null;
  const d = el("details", { class: "group" + (opts.focus ? " focus" : ""), style: opts.focus ? null : cstyle(name), "data-cat": opts.movable ? name : null, open: (query || !closed.has(name)) ? "" : false });
  d.addEventListener("toggle", () => {
    if (query) return;
    if (d.open) closed.delete(name); else closed.add(name);
    store.set("closedGroups", [...closed]);
  });
  const summary = el("summary", null,
    opts.movable ? el("span", { class: "handle", title: "끌어서 순서 바꾸기", "aria-hidden": "true", onclick: (e) => e.preventDefault() }, "⠿") : null,
    el("span", { class: "caret", "aria-hidden": "true" }),
    opts.movable ? el("button", { class: "dot", type: "button", title: "눌러서 색 바꾸기", "aria-label": name + " 색 바꾸기 (지금 " + PALETTE_KO[colorOf(name)] + ")",
      onclick: (e) => { e.preventDefault(); e.stopPropagation(); cycleColor(name); } })
      : opts.focus ? null : el("span", { class: "dot", "aria-hidden": "true" }),
    el("span", { class: "gname" }, label),
    el("span", { class: "gcount" }, String(open.length)),
    !opts.focus && total ? el("span", { class: "prog", title: "완료 " + doneCount + "/" + total }, el("i", { style: "width:" + Math.round(doneCount / total * 100) + "%" })) : null,
    next && !opts.focus ? el("span", { class: "dday gnext " + ddayClass(n) }, ddayLabel(n)) : el("span", { class: "gnext" }),
    opts.movable ? el("button", { type: "button", class: "gdel" + (armedCat === name ? " armed" : ""),
      title: "분류 지우기 (할 일은 미분류로 옮겨짐)",
      onclick: (e) => { e.preventDefault(); e.stopPropagation(); deleteCat(name); } },
      armedCat === name ? "한 번 더 누르면 분류 삭제" : "분류 삭제") : null
  );
  const body = el("div", { class: "gbody" });
  if (!open.length && !done.length) body.append(el("div", { class: "gempty" }, query ? "검색 결과가 없습니다." : "비어 있습니다. 위에서 '" + name + "'을 고르고 적으세요."));
  open.forEach(t => body.append(rowView(t, opts.focus)));
  if (done.length) {
    body.append(el("div", { class: "donebar" }, "완료 " + done.length,
      el("button", { type: "button", class: "ghost", onclick: () => removeMany(items.filter(t => t.done)) }, "완료 모두 지우기")));
    done.forEach(t => body.append(rowView(t, false)));
  }
  d.append(summary, body);
  return d;
}

function render() {
  if (dragging) return;
  renderCats();
  const active = document.activeElement;
  if (active && active.closest("#groups") && active.matches("textarea, input")) return; // 쓰는 중에는 목록을 다시 그리지 않음
  const box = $("groups");
  box.replaceChildren();
  const shown = tasks.filter(matches);
  const urgent = shown.filter(isUrgent);
  if (urgent.length && !query) box.append(groupView(FOCUS, "급한 일 · 3일 안 마감 · 지남 · ★", urgent, { focus: true }));
  const byCat = new Map(cats.map(c => [c, []]));
  const none = [];
  for (const t of shown) { const c = catOf(t); (c === NONE ? none : byCat.get(c)).push(t); }
  for (const [c, items] of byCat) {
    if (query && !items.length) continue;
    box.append(groupView(c, c, items, { movable: !query }));
  }
  if (none.length) box.append(groupView(NONE, NONE, none, {}));
  if (!box.children.length) {
    box.append(el("div", { class: "empty" }, query ? "'" + query + "'에 맞는 할 일이 없습니다."
      : "아직 아무것도 없습니다. 위에서 '+ 분류 추가'로 분류를 만들고 할 일을 적으세요."));
  }
}

/* ---------- 이벤트 ---------- */
const compose = $("compose");
compose.addEventListener("input", () => { grow(compose); renderPreview(); });
compose.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFromCompose(); }
});
$("addBtn").addEventListener("click", addFromCompose);
$("search").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });
const hd = $("hideDone");
hd.setAttribute("aria-pressed", String(hideDone));
hd.addEventListener("click", () => { hideDone = !hideDone; store.set("hideDone", hideDone); hd.setAttribute("aria-pressed", String(hideDone)); render(); });
document.addEventListener("focusout", (e) => { if (e.target.closest && e.target.closest("#groups")) setTimeout(render, 0); });
document.addEventListener("click", (e) => { if (armedCat && !e.target.closest(".gdel")) { armedCat = null; render(); } });

function reorderFrom(container) {
  const order = [...container.querySelectorAll("[data-cat]")].map(n => n.dataset.cat);
  const next = [...order.filter(c => cats.includes(c)), ...cats.filter(c => !order.includes(c))];
  dragging = false;
  if (next.join("\u0000") === cats.join("\u0000")) { render(); return; }
  saveCats(next);
}
if (window.Sortable) {
  const common = { animation: 150, ghostClass: "sort-ghost", chosenClass: "sort-chosen",
    onStart: () => { dragging = true; }, onEnd: (e) => reorderFrom(e.from) };
  Sortable.create($("cats"), { ...common, draggable: ".chip[data-cat]", delay: 250, delayOnTouchOnly: true, filter: ".newcat", preventOnFilter: false });
  Sortable.create($("groups"), { ...common, draggable: "details.group[data-cat]", handle: ".handle" });
}

const now = new Date();
$("today").textContent = pad(now.getMonth() + 1) + "." + pad(now.getDate()) + " " + "일월화수목금토"[now.getDay()];
// 자정이 지나면 D-day를 다시 계산
setInterval(() => { const d = ymd(new Date()); if (d !== $("today").dataset.d) { $("today").dataset.d = d; render(); } }, 60000);
$("today").dataset.d = ymd(now);

db = makeDb();
col = db.collection("tasks");
catsDoc = db.doc("meta/categories");
catsDoc.onSnapshot((snap) => {
  cats = snap.exists && Array.isArray(snap.data().list) ? [...snap.data().list] : [];
  catColors = snap.exists && snap.data().colors ? { ...snap.data().colors } : {};
  render();
});
col.onSnapshot((snap) => {
  tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  setStatus("");
  render();
});
</script>
